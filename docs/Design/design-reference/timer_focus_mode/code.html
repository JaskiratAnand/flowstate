<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Organic Studio Pomodoro - Focus Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#3ce619",
          "background-light": "#f6f8f6",
          "background-dark": "#142111",
          // Mapping PRD variables conceptually
          "paper": "#F9F6F0",
          "surface": "#F1EDE4",
          "ink": "#2D2B2A",
          "muted": "#8C8885"
        },
        fontFamily: {
          "display": ["Karla", "sans-serif"],
          "body": ["Karla", "sans-serif"]
        },
        borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
        boxShadow: {
          'ambient': '4px 6px 12px rgba(45, 43, 42, 0.08), -4px -4px 10px rgba(255, 255, 255, 0.7)',
          'pressed': 'inset 3px 3px 6px rgba(45, 43, 42, 0.1), inset -2px -2px 4px rgba(255, 255, 255, 0.6)'
        }
      },
    },
  }
</script>
<style>
  body {
    font-family: 'Karla', sans-serif;
    /* Ensuring the body sets a neutral backdrop for the popup */
    background-color: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  
  /* Tactical Neumorphic Interactions */
  .dial-btn {
    transition: box-shadow 0.1s ease, transform 0.1s ease;
  }
  
  /* Checked state simulates the paused/pressed state */
  .dial-checkbox:checked + .dial-btn {
    box-shadow: inset 3px 3px 6px rgba(45, 43, 42, 0.1), inset -2px -2px 4px rgba(255, 255, 255, 0.6);
  }
  
  .dial-checkbox:checked + .dial-btn .timer-text {
    opacity: 0.5;
    animation: pulse 2s infinite ease-in-out;
  }
  
  .dial-btn:hover .timer-text {
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* SVG Ring Animation Setup */
  .progress-ring__circle {
    transition: stroke-dashoffset 0.35s;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    /* 220px diameter = 110px radius. Circumference = 2 * PI * r = ~691 */
    stroke-dasharray: 691;
    stroke-dashoffset: 0; /* Fully solid for the mock state, usually starts at 691 */
  }
  
  /* Mock Active State where it's partially filled */
  .dial-checkbox:not(:checked) + .dial-btn .progress-ring__circle {
    stroke-dashoffset: 200; /* Example partial fill */
  }
  
  /* Invisible ring when pressed/paused */
  .dial-checkbox:checked + .dial-btn .progress-ring__circle {
     stroke-opacity: 0;
     transition: stroke-opacity 0.2s ease;
  }
</style>
</head>
<body class="antialiased">
<!-- Extension Window Container -->
<div class="relative flex flex-col w-[320px] h-[480px] bg-paper rounded-lg shadow-2xl overflow-hidden">
<!-- Header -->
<header class="pt-8 pb-4 text-center">
<h1 class="text-muted text-[14px] font-semibold tracking-[1.2px] uppercase">Focus</h1>
</header>
<!-- Main Dial Area -->
<main class="flex-1 flex flex-col items-center justify-center relative">
<!-- Hidden checkbox to control state entirely in CSS for this demo -->
<input class="dial-checkbox hidden" id="dial-toggle" type="checkbox"/>
<label class="dial-btn relative w-[220px] h-[220px] rounded-full bg-surface shadow-ambient flex items-center justify-center cursor-pointer group select-none" for="dial-toggle">
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 220 220">
<circle class="progress-ring__circle" cx="110" cy="110" fill="transparent" r="110" stroke="var(--color-primary, #3ce619)" stroke-width="4"></circle>
</svg>
<!-- Timer Display -->
<div class="timer-text text-ink text-[56px] font-light tracking-tight tabular-nums transition-opacity duration-200">
          25:00
        </div>
</label>
</main>
<!-- Bottom Navigation (Shared Component Integration) -->
<footer class="w-full pb-6 pt-4 flex justify-between gap-2 px-10">
<button aria-label="Task Log" class="p-3 text-muted hover:text-ink transition-colors rounded-full hover:bg-surface">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">
          list
        </span>
</button>
<button aria-label="Statistics" class="p-3 text-muted hover:text-ink transition-colors rounded-full hover:bg-surface">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">
          bar_chart
        </span>
</button>
<button aria-label="Settings" class="p-3 text-muted hover:text-ink transition-colors rounded-full hover:bg-surface">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">
          settings
        </span>
</button>
</footer>
</div>
</body></html>
