<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Organic Studio - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed": "#370a1b",
                        "backdrop": "#E5E5E5",
                        "on-surface-variant": "#3d4b36",
                        "on-secondary-container": "#65625f",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e1ecd7",
                        "primary": "#126e00",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#cbc5c2",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#1d1b19",
                        "on-background": "#151e11",
                        "inverse-surface": "#2a3325",
                        "surface-tint": "#126e00",
                        "surface-dim": "#d3dec9",
                        "paper": "#F9F6F0",
                        "tertiary-fixed": "#ffd9e1",
                        "primary-fixed-dim": "#3ae416",
                        "tertiary": "#884c5d",
                        "secondary-container": "#e4dfdb",
                        "surface-container": "#e7f1dd",
                        "outline-variant": "#bbcbb1",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#0b5300",
                        "ink": "#2D2B2A",
                        "tertiary-fixed-dim": "#fdb2c5",
                        "surface-container-low": "#ecf7e2",
                        "on-tertiary-fixed-variant": "#6c3546",
                        "on-primary-fixed": "#022100",
                        "tertiary-container": "#ffb3c6",
                        "surface-variant": "#dbe6d2",
                        "primary-fixed": "#79ff59",
                        "on-primary-container": "#0f6100",
                        "on-secondary-fixed-variant": "#494644",
                        "surface": "#F1EDE4",
                        "surface-bright": "#f2fde8",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#3ae416",
                        "on-tertiary-container": "#7b4252",
                        "muted": "#8C8885",
                        "background": "#f2fde8",
                        "on-tertiary": "#ffffff",
                        "secondary": "#615e5b",
                        "outline": "#6c7b64",
                        "primary-container": "#3ce619",
                        "surface-container-highest": "#dbe6d2",
                        "secondary-fixed": "#e7e1de",
                        "inverse-on-surface": "#e9f4df",
                        "on-error": "#ffffff",
                        "on-surface": "#151e11"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "section-gap": "2rem",
                        "unit": "4px",
                        "container-padding": "2.5rem",
                        "icon-padding": "0.75rem"
                    },
                    fontFamily: {
                        "label-nav": ["Karla"],
                        "headline-label": ["Karla"],
                        "display-timer": ["Karla"],
                        "body-standard": ["Karla"]
                    },
                    fontSize: {
                        "label-nav": ["12px", { lineHeight: "1.2", fontWeight: "500" }],
                        "headline-label": ["14px", { lineHeight: "1.2", letterSpacing: "1.2px", fontWeight: "600" }],
                        "display-timer": ["56px", { lineHeight: "1", letterSpacing: "-0.02em", fontWeight: "300" }],
                        "body-standard": ["16px", { lineHeight: "1.5", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .neo-dark-ambient {
            box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.4), -8px -8px 16px rgba(255, 255, 255, 0.05);
        }
        .neo-dark-pressed {
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.4), inset -4px -4px 8px rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-on-background text-paper font-body-standard min-h-screen flex flex-col items-center antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 bg-on-background flex justify-between items-center px-container-padding py-4 z-10 sticky">
<div class="font-headline-label text-headline-label text-primary-fixed-dim tracking-widest uppercase">
            Organic Studio
        </div>
<div class="flex items-center gap-4 text-primary-fixed-dim cursor-pointer transition-all duration-300 hover:opacity-80">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Content -->
<main class="w-full max-w-[400px] flex-grow px-8 py-8 flex flex-col gap-section-gap pb-32">
<!-- Header -->
<div>
<h1 class="font-headline-label text-headline-label text-paper mb-2 uppercase tracking-widest">Preferences</h1>
<p class="text-secondary-fixed-dim text-sm">Configure your focus environment.</p>
</div>
<!-- Settings Group: Work Session -->
<div class="flex flex-col gap-4">
<h2 class="font-label-nav text-label-nav text-muted uppercase tracking-wider">Session Defaults</h2>
<div class="bg-[#1c2817] rounded-xl p-6 neo-dark-ambient flex flex-col gap-6">
<!-- Slider Control -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="font-body-standard text-paper">Focus Duration</span>
<span class="font-headline-label text-headline-label text-primary-fixed-dim">25m</span>
</div>
<div class="relative w-full h-2 bg-[#0a0f08] rounded-full neo-dark-pressed">
<div class="absolute top-0 left-0 h-full bg-primary-fixed-dim rounded-full" style="width: 50%;"></div>
<div class="absolute top-1/2 -mt-3 ml-[-12px] w-6 h-6 bg-[#1c2817] rounded-full neo-dark-ambient flex items-center justify-center cursor-pointer border border-primary-fixed-dim" style="left: 50%;">
<div class="w-2 h-2 bg-primary-fixed-dim rounded-full"></div>
</div>
</div>
</div>
<!-- Slider Control -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="font-body-standard text-paper">Short Break</span>
<span class="font-headline-label text-headline-label text-primary-fixed-dim">5m</span>
</div>
<div class="relative w-full h-2 bg-[#0a0f08] rounded-full neo-dark-pressed">
<div class="absolute top-0 left-0 h-full bg-primary-fixed-dim rounded-full" style="width: 20%;"></div>
<div class="absolute top-1/2 -mt-3 ml-[-12px] w-6 h-6 bg-[#1c2817] rounded-full neo-dark-ambient flex items-center justify-center cursor-pointer border border-primary-fixed-dim" style="left: 20%;">
<div class="w-2 h-2 bg-primary-fixed-dim rounded-full"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Settings Group: Environment -->
<div class="flex flex-col gap-4">
<h2 class="font-label-nav text-label-nav text-muted uppercase tracking-wider">Environment</h2>
<div class="bg-[#1c2817] rounded-xl p-6 neo-dark-ambient flex flex-col gap-6">
<!-- Toggle Control -->
<div class="flex justify-between items-center">
<span class="font-body-standard text-paper flex items-center gap-2">
<span class="material-symbols-outlined text-muted" data-icon="dark_mode">dark_mode</span>
                        Dark Theme
                    </span>
<div class="w-12 h-6 bg-primary-fixed-dim rounded-full relative cursor-pointer neo-dark-pressed transition-colors">
<div class="absolute right-1 top-1 w-4 h-4 bg-[#1c2817] rounded-full neo-dark-ambient transition-transform"></div>
</div>
</div>
<!-- Toggle Control -->
<div class="flex justify-between items-center">
<span class="font-body-standard text-paper flex items-center gap-2">
<span class="material-symbols-outlined text-muted" data-icon="volume_up">volume_up</span>
                        Ambient Sounds
                    </span>
<div class="w-12 h-6 bg-[#0a0f08] rounded-full relative cursor-pointer neo-dark-pressed transition-colors">
<div class="absolute left-1 top-1 w-4 h-4 bg-muted rounded-full neo-dark-ambient transition-transform"></div>
</div>
</div>
<!-- Toggle Control -->
<div class="flex justify-between items-center">
<span class="font-body-standard text-paper flex items-center gap-2">
<span class="material-symbols-outlined text-muted" data-icon="notifications_active">notifications_active</span>
                        Tick Sound
                    </span>
<div class="w-12 h-6 bg-[#0a0f08] rounded-full relative cursor-pointer neo-dark-pressed transition-colors">
<div class="absolute left-1 top-1 w-4 h-4 bg-muted rounded-full neo-dark-ambient transition-transform"></div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-between items-center px-[40px] pb-6 pt-4 bg-surface-container z-50 shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-full transition-all group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform duration-150 ease-in-out" data-icon="timer">timer</span>
<span class="font-label-nav text-label-nav mt-1 hidden">Timer</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-full transition-all group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform duration-150 ease-in-out" data-icon="receipt_long">receipt_long</span>
<span class="font-label-nav text-label-nav mt-1 hidden">Log</span>
</a>
<a class="flex flex-col items-center justify-center bg-surface-container-highest text-on-surface rounded-full p-2 group shadow-none" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform duration-150 ease-in-out" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-nav text-label-nav mt-1 hidden">Settings</span>
</a>
</nav>
</body></html>
