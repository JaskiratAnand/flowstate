<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Organic Studio - Timer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-family: 'Material Symbols Outlined';
                font-weight: normal;
                font-style: normal;
                font-size: 24px;
                line-height: 1;
                letter-spacing: normal;
                text-transform: none;
                display: inline-block;
                white-space: nowrap;
                word-wrap: normal;
                direction: ltr;
                -webkit-font-feature-settings: 'liga';
                -webkit-font-smoothing: antialiased;
            }
            .neomorph-dial-dark {
                box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05), 5px 5px 15px rgba(0,0,0,0.4), -5px -5px 15px rgba(255,255,255,0.02);
            }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#370a1b",
                        "backdrop": "#E5E5E5",
                        "on-surface-variant": "#3d4b36",
                        "on-secondary-container": "#65625f",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e1ecd7",
                        "primary": "#126e00",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#cbc5c2",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#1d1b19",
                        "on-background": "#151e11",
                        "inverse-surface": "#2a3325",
                        "surface-tint": "#126e00",
                        "surface-dim": "#d3dec9",
                        "paper": "#F9F6F0",
                        "tertiary-fixed": "#ffd9e1",
                        "primary-fixed-dim": "#3ae416",
                        "tertiary": "#884c5d",
                        "secondary-container": "#e4dfdb",
                        "surface-container": "#e7f1dd",
                        "outline-variant": "#bbcbb1",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#0b5300",
                        "ink": "#2D2B2A",
                        "tertiary-fixed-dim": "#fdb2c5",
                        "surface-container-low": "#ecf7e2",
                        "on-tertiary-fixed-variant": "#6c3546",
                        "on-primary-fixed": "#022100",
                        "tertiary-container": "#ffb3c6",
                        "surface-variant": "#dbe6d2",
                        "primary-fixed": "#79ff59",
                        "on-primary-container": "#0f6100",
                        "on-secondary-fixed-variant": "#494644",
                        "surface": "#F1EDE4",
                        "surface-bright": "#f2fde8",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#3ae416",
                        "on-tertiary-container": "#7b4252",
                        "muted": "#8C8885",
                        "background": "#f2fde8",
                        "on-tertiary": "#ffffff",
                        "secondary": "#615e5b",
                        "outline": "#6c7b64",
                        "primary-container": "#3ce619",
                        "surface-container-highest": "#dbe6d2",
                        "secondary-fixed": "#e7e1de",
                        "inverse-on-surface": "#e9f4df",
                        "on-error": "#ffffff",
                        "on-surface": "#151e11"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "2rem",
                        "unit": "4px",
                        "container-padding": "2.5rem",
                        "icon-padding": "0.75rem"
                    },
                    "fontFamily": {
                        "label-nav": ["Karla"],
                        "headline-label": ["Karla"],
                        "display-timer": ["Karla"],
                        "body-standard": ["Karla"]
                    },
                    "fontSize": {
                        "label-nav": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-label": ["14px", { "lineHeight": "1.2", "letterSpacing": "1.2px", "fontWeight": "600" }],
                        "display-timer": ["56px", { "lineHeight": "1", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "body-standard": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background dark:bg-on-background text-on-surface dark:text-surface-container-highest antialiased min-h-screen flex flex-col items-center justify-center font-body-standard">
<!-- App Container -->
<div class="relative w-full max-w-[320px] h-[480px] bg-paper dark:bg-inverse-surface rounded-[2rem] overflow-hidden shadow-2xl flex flex-col justify-between">
<!-- TopAppBar -->
<header class="w-full top-0 bg-background dark:bg-on-background flex justify-between items-center px-container-padding py-4 w-full flat no shadows z-10 relative">
<div class="font-headline-label text-headline-label text-primary tracking-widest uppercase">
                Organic Studio
            </div>
<div class="hidden">
<!-- search hidden as per JSON -->
</div>
<div class="flex items-center gap-2">
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity cursor-pointer transition-all duration-300">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas (The Dial) -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding relative z-0">
<!-- Dial Container -->
<div class="relative w-[200px] h-[200px] rounded-full neomorph-dial-dark flex items-center justify-center bg-surface dark:bg-inverse-surface group cursor-pointer active:scale-95 transition-transform duration-300">
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<!-- Background Track -->
<circle class="text-secondary dark:text-on-secondary-fixed-variant opacity-20" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-width="2"></circle>
<!-- Active Progress -->
<circle class="text-primary dark:text-primary-fixed-dim transition-all duration-1000 ease-linear" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="301.59" stroke-dashoffset="60" stroke-width="2"></circle>
</svg>
<!-- Timer Display -->
<div class="flex flex-col items-center justify-center">
<span class="font-display-timer text-display-timer text-ink dark:text-surface-container-highest tracking-tight">25:00</span>
<span class="font-label-nav text-label-nav text-muted dark:text-surface-dim mt-2 uppercase tracking-widest">Focus</span>
</div>
</div>
<!-- Session Indicators -->
<div class="mt-8 flex gap-3">
<div class="w-2 h-2 rounded-full bg-primary dark:bg-primary-fixed-dim shadow-[0_0_5px_rgba(58,228,22,0.5)]"></div>
<div class="w-2 h-2 rounded-full bg-surface dark:bg-on-secondary-fixed-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface dark:bg-on-secondary-fixed-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface dark:bg-on-secondary-fixed-variant"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-paper dark:bg-surface-container shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] md:hidden absolute">
<div class="fixed bottom-0 left-0 w-full flex justify-between items-center px-[40px] pb-6 pt-4 relative">
<!-- Timer (Active) -->
<button class="flex items-center justify-center bg-surface dark:bg-surface-container-highest text-ink dark:text-on-surface rounded-full shadow-[inset_2px_2px_5px_#b8b4ae,inset_-2px_-2px_5px_#ffffff] dark:shadow-none p-2 hover:bg-surface dark:hover:bg-surface-container-high transition-all Active: scale-95 transition-transform duration-150 ease-in-out cursor-pointer group">
<span class="material-symbols-outlined" data-icon="timer" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="sr-only">Timer</span>
</button>
<!-- Log (Inactive) -->
<button class="flex items-center justify-center text-muted dark:text-on-surface-variant p-2 hover:bg-surface dark:hover:bg-surface-container-high rounded-full transition-all cursor-pointer group">
<span class="material-symbols-outlined group-hover:text-ink dark:group-hover:text-on-surface transition-colors" data-icon="receipt_long">receipt_long</span>
<span class="sr-only">Log</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex items-center justify-center text-muted dark:text-on-surface-variant p-2 hover:bg-surface dark:hover:bg-surface-container-high rounded-full transition-all cursor-pointer group">
<span class="material-symbols-outlined group-hover:text-ink dark:group-hover:text-on-surface transition-colors" data-icon="settings">settings</span>
<span class="sr-only">Settings</span>
</button>
</div>
</nav>
</div>
</body></html>
